<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledgerline · Billing, Spaces and Clubs</title>
<style>
:root{--bg:#f1efe8;--ink:#1d2030;--mut:#5b5f70;--acc:#5b6ee1;--hi:#fff;--lo:#cfcbbd;--ok:#17724a;--warn:#b86a00;--line:rgba(29,32,48,.1);--r:20px}
:root[data-theme=dark]{--bg:#161827;--ink:#ecebf5;--mut:#9a9db5;--acc:#8d9bff;--hi:#20233a;--lo:#0c0d17;--ok:#5fd29a;--warn:#ffb454;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 Inter,system-ui,sans-serif;transition:background .3s}
.top{display:flex;gap:10px;align-items:center;padding:14px 20px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-size:19px;letter-spacing:-.02em;margin-right:8px}.logo b{color:var(--acc);font-weight:800}.logo span{font-weight:400}
.tabs{display:flex;gap:8px;overflow:auto;flex:1;padding:4px}
.tab,.btn{font-family:inherit;font-weight:700;font-size:13px;line-height:1;border:0;border-radius:14px;padding:12px 16px;background:var(--bg);color:var(--ink);cursor:pointer;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi);white-space:nowrap;text-decoration:none;transition:transform .15s}
.tab:hover,.btn:hover{transform:translateY(-1px)}
.tab[aria-selected=true]{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);color:var(--acc)}
.btn.p{background:var(--acc);color:#fff}.btn.sm{padding:9px 13px}.btn[disabled]{opacity:.45;cursor:not-allowed}
main{max-width:1060px;margin:0 auto;padding:26px 20px 80px}
h2{font:400 34px/1.1 "Instrument Serif",Georgia,serif;margin:0 0 6px}h3{margin:0 0 6px;font-size:17px}
.sub{color:var(--mut);margin:0 0 22px;max-width:640px}
.card{background:var(--bg);border-radius:var(--r);padding:22px;box-shadow:8px 8px 18px var(--lo),-8px -8px 18px var(--hi)}
.in{box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);border-radius:14px;padding:12px 14px}
.grid{display:grid;gap:20px;align-items:start}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pill{display:inline-block;font-weight:700;font-size:11px;line-height:1;padding:6px 10px;border-radius:99px;background:rgba(91,110,225,.14);color:var(--acc);letter-spacing:.04em;text-transform:uppercase}
.pill.ok{background:rgba(23,114,74,.15);color:var(--ok)}.pill.w{background:rgba(184,106,0,.15);color:var(--warn)}
.price{font-weight:800;font-size:38px;line-height:1;letter-spacing:-.03em;margin:10px 0 2px}.price small{font-weight:500;font-size:14px;color:var(--mut)}
ul.f{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:8px;font-size:14px}ul.f li:before{content:"✓";color:var(--acc);font-weight:800;margin-right:8px}ul.f li.x{color:var(--mut)}ul.f li.x:before{content:"–";color:var(--mut)}
.seg{display:inline-flex;border-radius:14px;padding:4px;box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.seg button{border:0;background:none;font-family:inherit;font-weight:700;font-size:13px;color:var(--mut);padding:9px 14px;border-radius:10px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}.st{flex:1;min-width:150px;padding:14px;border-radius:16px;font-weight:700;font-size:13px;box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);color:var(--mut)}
.st.done{color:var(--ok)}.st.cur{color:var(--acc);box-shadow:6px 6px 14px var(--lo),-6px -6px 14px var(--hi)}
.note{font-size:12.5px;color:var(--mut)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all}
.qr{width:170px;height:170px;background:#fff;border-radius:12px;padding:10px}
.modal{position:fixed;inset:0;background:rgba(10,12,24,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}.modal.on{display:flex}
.modal .card{max-width:760px;width:100%;max-height:92vh;overflow:auto}.x{float:right}
label{font-weight:700;font-size:13px;display:block;margin:12px 0 6px}input,select{width:100%;font:inherit;color:var(--ink);background:none;border:0;outline:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:8px 0}
.lock{filter:grayscale(.4);opacity:.7;pointer-events:none}
.bar{height:8px;border-radius:8px;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:8px}
.fade{animation:up .45s cubic-bezier(.2,.9,.3,1) both}@keyframes up{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="top"><div class="logo"><svg width="26" height="26" viewBox="0 0 32 32" fill="none"><path d="M3 20H29" stroke="#5b6ee1" stroke-width="2.6" stroke-linecap="round"/><rect x="12.5" y="8" width="7" height="16" rx="2" fill="#5b6ee1"/><path d="M16 3V8M16 24V29" stroke="#5b6ee1" stroke-width="2.6" stroke-linecap="round"/></svg><span><b>Ledger</b><span>line</span></span></div>
<div class="tabs" id="tabs" role="tablist"></div><button class="btn sm" id="th">☾</button></div>
<main id="v"></main>
<div class="modal" id="md"><div class="card" id="mc"></div></div>
<script>
const $=s=>document.querySelector(s),root=document.documentElement;
const PR={pro:[149,1199],mentor:[499,4999]};
const S={tab:'billing',yr:true,pay:'upi',plan:'pro',coin:'USDC',net:'Polygon',cs:0,mentor:'unverified',who:'mentor',jm:'open',vis:'public',drawer:false,cancel:false};
const T=[['billing','Billing (Settings)'],['spaces','Spaces'],['clubs','Clubs']];
const amt=p=>PR[p][S.yr?1:0];const P=p=>`₹${PR[p][S.yr?1:0].toLocaleString('en-IN')}<small>/${S.yr?'year':'month'}</small>`;
const qr=()=>{let r=7,c='';const rnd=()=>(r=(r*9301+49297)%233280)/233280;for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);if(f?((x%6==0||y%6==0||x%6==6||y%6==6||(x%7>1&&x%7<5&&y%7>1&&y%7<5))):rnd()>.52)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg class="qr" viewBox="0 0 21 21" fill="#1d2030">${c}</svg>`};
const plans=()=>`<div class="seg" style="margin-bottom:18px"><button aria-pressed="${!S.yr}" data-yr="0">Monthly</button><button aria-pressed="${S.yr}" data-yr="1">Yearly · 2 months free</button></div>
<div class="grid g3">
<div class="card"><span class="pill">Free</span><div class="price">₹0</div><p class="note">For building the habit.</p><ul class="f"><li>Journal, trade log, process score</li><li>Streaks, rewards, certificates</li><li>Join and create clubs, join any space</li><li>Basic insights</li><li class="x">Replay, mistake lab, AI reports</li><li class="x">Create a mentor space</li></ul><button class="btn" disabled>Current plan</button></div>
<div class="card"><span class="pill">Pro</span><div class="price">${P('pro')}</div><p class="note">For serious solo traders.</p><ul class="f"><li>Everything in Free</li><li>Full insights and filters</li><li>Replay and mistake lab</li><li>AI reports from your own data</li><li>Unlimited history, PDF reports</li><li>Custom portfolio themes</li></ul><button class="btn p" data-open="pro">Choose Pro</button></div>
<div class="card"><span class="pill ok">Mentor · verified only</span><div class="price">${P('mentor')}</div><p class="note">For teachers running a cohort.</p><ul class="f"><li>Everything in Pro</li><li>Spaces up to 50 members</li><li>Announcements and assignments</li><li>Cohort process view (opt-in)</li><li>Verified mentor badge</li><li>Members always join free</li></ul><button class="btn p" data-open="mentor">Choose Mentor</button></div></div>`;
function billing(){return`<h2>Billing</h2><p class="sub">One page: your plan, the plans you can switch to, payment method, crypto period and invoices. Everything is sample data. Prices are sample and live in one config file.</p>
<div class="grid g2" style="margin-bottom:22px"><div class="card fade"><span class="pill ok">Pro · active</span><div class="price" style="font-size:28px">Renews 21 Dec 2026</div><p class="note">UPI autopay · ₹149 / month</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" data-open="pro">Update payment</button><button class="btn sm" data-cancel="1">Cancel plan</button></div></div>
<div class="card fade" style="animation-delay:.06s"><h3>Crypto period</h3><p class="note">Paid in crypto? Your plan runs to the date below and we remind you 7 days before.</p><div class="bar"><i style="width:62%"></i></div><p class="note">Pro until 14 Feb 2027 · 62% left</p><button class="btn sm" data-open="pro" data-crypto="1">Extend with crypto</button></div></div>
<div class="in" style="border-left:4px solid var(--warn);margin-bottom:22px"><b>Payment failed.</b> We'll retry for 7 days and your plan stays active until 28 Nov. <a href="#" style="color:var(--acc)">Update payment</a> <span class="note">(shown only when a payment fails)</span></div>
<h3 style="font-size:20px;margin-bottom:12px">Plans</h3>${plans()}
<p class="note" style="margin:14px 0 26px">Streaks, scoring, rewards and certificates are free for everyone. Paid plans add tools, never an advantage in your score. Educational use only: Ledgerline gives no trading tips or calls. Mentor needs verification first.</p>
<div class="card"><h3>Invoices</h3>${[['INV-0003','21 Nov 2026','₹149','UPI'],['INV-0002','21 Oct 2026','₹149','UPI'],['INV-0001','21 Sep 2026','13.60 USDC','Crypto']].map(r=>`<div class="row"><span><b>${r[0]}</b> · ${r[1]}</span><span>${r[2]} · ${r[3]} <a href="#" class="btn sm" style="margin-left:8px">PDF</a></span></div>`).join('')}</div>`}
function crypt(){const st=['Waiting for payment','Confirming on network','Paid · plan unlocked'];return`<h3>Send exactly ${S.yr?'13.60':'1.70'} ${S.coin}</h3><p class="note">Network: ${S.net} · quote expires in <b>14:59</b> · sample QR and address</p><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:12px 0">${qr()}<div style="flex:1;min-width:160px"><div class="in mono">0xSAMPLE…a91F</div><button class="btn sm" style="margin-top:10px">Copy address</button></div></div><div class="steps" style="margin:10px 0">${st.map((x,i)=>`<div class="st ${i<S.cs-1?'done':i==S.cs-1?'cur':''}">${i<S.cs-1?'✓ ':''}${x}</div>`).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-adv="1">Simulate next state</button><button class="btn sm" data-reset="1">Reset</button></div><p class="note" style="margin-top:10px">Underpaid: we ask for a top-up. Expired: get a fresh quote. Send only this coin on this network.</p>`}
function drawer(){const pl=S.plan,m=S.pay,A=amt(pl),name=pl=='pro'?'Pro':'Mentor';
return`<button class="btn sm x" data-close="1">Close</button><h3 style="font-size:22px">Subscribe to ${name}</h3><p class="note">${S.yr?'Billed yearly':'Billed monthly'} · sample amounts · cancel anytime in Billing.</p>
<div class="grid g2" style="margin-top:14px"><div><div class="seg" style="margin-bottom:14px"><button aria-pressed="${m=='upi'}" data-pay="upi">UPI</button><button aria-pressed="${m=='card'}" data-pay="card">Card</button><button aria-pressed="${m=='crypto'}" data-pay="crypto">Crypto</button></div>
${m=='upi'?`<label>UPI ID</label><div class="in"><input placeholder="name@bank"></div><p class="note">UPI autopay renews on the same date each ${S.yr?'year':'month'}.</p><button class="btn p">Pay ₹${A.toLocaleString('en-IN')}</button>`:''}
${m=='card'?`<label>Card number</label><div class="in"><input placeholder="•••• •••• •••• ••••"></div><div class="grid g2" style="gap:10px"><div><label>Expiry</label><div class="in"><input placeholder="MM / YY"></div></div><div><label>CVC</label><div class="in"><input placeholder="•••"></div></div></div><button class="btn p" style="margin-top:14px">Pay and subscribe</button>`:''}
${m=='crypto'?`<div class="grid g2" style="gap:10px"><div><label>Coin</label><div class="in"><select><option>USDC</option><option>USDT</option></select></div></div><div><label>Network</label><div class="in"><select><option>Polygon</option><option>Base</option><option>Tron</option></select></div></div></div><p class="note" style="margin-top:10px">Crypto buys a fixed period, no auto-renew.</p><button class="btn p" data-cs="1">Show payment details</button>`:''}</div>
<div>${m=='crypto'&&S.cs?crypt():`<div class="card in" style="box-shadow:none"><h3>Order summary</h3><div class="row"><span>${name} · ${S.yr?'12 months':'1 month'}</span><b>₹${A.toLocaleString('en-IN')}</b></div><div class="row"><span>GST</span><b>incl.</b></div><p class="note">A GST invoice is emailed after payment. If you downgrade, your data stays yours.</p></div>`}</div></div>`}
function spaces(){const s=S.mentor,cur={unverified:0,unpaid:1,active:2}[s];
const who=`<div class="seg" style="margin-bottom:18px"><button aria-pressed="${S.who=='mentor'}" data-who="mentor">I'm a mentor</button><button aria-pressed="${S.who=='student'}" data-who="student">I'm a student</button></div>`;
if(S.who=='student')return`<h2>Spaces</h2><p class="sub">Joining is always free. Spaces are private by default.</p>${who}<div class="grid g2"><div class="card fade"><h3>My spaces</h3><div class="row"><span><b>Intraday risk cohort</b><br><span class="note">Mentor verified · sample</span></span><span class="btn sm">Open</span></div><div class="row"><span><b>Journaling basics</b><br><span class="note">Mentor verified · sample</span></span><span class="btn sm">Open</span></div></div><div class="card fade"><h3>Join with a code</h3><div class="in"><input placeholder="Enter invite code"></div><button class="btn p" style="margin-top:12px">Join space</button><p class="note" style="margin-top:12px">Sharing your process stats with a mentor is opt-in and can be turned off anytime.</p></div></div>`;
return`<h2>Spaces</h2><p class="sub">For teachers running a cohort. Clubs are separate and free for everyone.</p>${who}
<div class="seg" style="margin-bottom:18px"><button aria-pressed="${s=='unverified'}" data-mentor="unverified">Not verified</button><button aria-pressed="${s=='unpaid'}" data-mentor="unpaid">Verified, not paid</button><button aria-pressed="${s=='active'}" data-mentor="active">Active mentor</button></div><p class="note" style="margin:-8px 0 14px">(The three buttons above only preview each state. Users never see them.)</p>
<div class="steps">${['1 Verify you teach','2 Unlock Mentor plan','3 Create your space'].map((x,i)=>`<div class="st ${i<cur?'done':i==cur?'cur':''}">${i<cur?'✓ ':''}${x}</div>`).join('')}</div>
${s=='unverified'?`<div class="card fade"><h3>Verify you teach</h3><p class="note">Free. A person reviews it. Educational use only, no tips or calls.</p><label>What do you teach?</label><div class="in"><input placeholder="e.g. Risk management for intraday traders"></div><label>Evidence link</label><div class="in"><input placeholder="Channel, site or profile"></div>${["I teach education, not tips","I won't promise returns","I won't sell signals or calls","I accept the mentor code of conduct"].map(x=>`<label class="chk"><input type="checkbox" style="width:auto;margin-top:3px"> ${x}</label>`).join('')}<button class="btn p" style="margin-top:10px">Submit for review</button></div>`:''}
${s=='unpaid'?`<div class="grid g2"><div class="card fade"><span class="pill ok">Verified</span><h3 style="margin-top:10px">Unlock Spaces</h3><p class="note">You're approved. Subscribe to the Mentor plan to create your first space. Members always join free.</p><div class="price">${P('mentor')}</div><ul class="f"><li>Spaces up to 50 members</li><li>Announcements and assignments</li><li>Cohort process view (opt-in)</li></ul><button class="btn p" data-open="mentor">Unlock with Mentor plan</button></div><div class="card lock"><h3>Create a space 🔒</h3><label>Space name</label><div class="in"><input placeholder="Locked until you subscribe"></div><button class="btn" style="margin-top:12px">Create</button></div></div>`:''}
${s=='active'?`<div class="grid g2"><div class="card fade"><span class="pill ok">Mentor · active</span><h3 style="margin-top:10px">Intraday risk cohort <span class="note">(sample)</span></h3><div class="bar"><i style="width:36%"></i></div><p class="note">18 of 50 members · 14 opted in to process view</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm">Post announcement</button><button class="btn sm">New assignment</button><button class="btn sm">Invite code</button></div></div><div class="card fade"><h3>Create another space</h3><label>Space name</label><div class="in"><input placeholder="Name your space"></div><button class="btn p" style="margin-top:14px">Create space</button></div></div>`:''}`}
function clubs(){return`<h2>Clubs</h2><p class="sub">Free for everyone. Anyone can create or join a club.</p><div class="grid g2"><div class="card fade"><h3>Discover</h3>${[['Morning planners','Open · 124 members'],['Rule keepers','Request to join · 61 members'],['Options process lab','Invite only · private']].map(x=>`<div class="row"><span><b>${x[0]}</b><br><span class="note">${x[1]} · sample</span></span><span class="btn sm">View</span></div>`).join('')}</div><div class="card fade" style="animation-delay:.07s"><h3>Create a club <span class="pill ok">Free</span></h3><label>Club name</label><div class="in"><input placeholder="Name your club"></div><label>How people join</label><div class="seg"><button aria-pressed="${S.jm=='open'}" data-jm="open">Open</button><button aria-pressed="${S.jm=='request'}" data-jm="request">Request</button><button aria-pressed="${S.jm=='invite'}" data-jm="invite">Invite only</button></div><label>Visibility</label><div class="seg"><button aria-pressed="${S.vis=='public'}" data-vis="public">Public (listed)</button><button aria-pressed="${S.vis=='private'}" data-vis="private">Private (unlisted)</button></div><button class="btn p" style="margin-top:16px">Create club</button></div></div>`}
const V={billing,spaces,clubs};
function render(keep){$('#tabs').innerHTML=T.map(t=>`<button class="tab" role="tab" aria-selected="${S.tab==t[0]}" data-tab="${t[0]}">${t[1]}</button>`).join('');
const y=scrollY;$('#v').innerHTML=V[S.tab]();
if(S.drawer){$('#mc').innerHTML=drawer();$('#md').classList.add('on')}else if(S.cancel){$('#mc').innerHTML=`<h3>Cancel your plan?</h3><p class="note">You keep Pro until 21 Dec 2026. Your journal, streak and certificates stay. Spaces and Pro tools go read-only after that. Nothing is deleted.</p><div style="display:flex;gap:10px;margin-top:14px"><button class="btn" data-close="1">Keep plan</button><button class="btn p" data-close="1">Cancel at period end</button></div>`;$('#md').classList.add('on')}else $('#md').classList.remove('on');
if(keep)scrollTo(0,y)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-yr],[data-open],[data-pay],[data-cs],[data-adv],[data-reset],[data-mentor],[data-who],[data-jm],[data-vis],[data-cancel],[data-close]');if(!t)return;const d=t.dataset;
if(d.tab){S.tab=d.tab;scrollTo(0,0)}if(d.yr!=null)S.yr=d.yr=='1';if(d.open){S.plan=d.open;S.drawer=true;S.cs=0;S.pay=d.crypto?'crypto':'upi'}
if(d.pay){S.pay=d.pay;S.cs=0}if(d.cs)S.cs=1;if(d.adv)S.cs=Math.min(3,S.cs+1);if(d.reset)S.cs=1;
if(d.mentor)S.mentor=d.mentor;if(d.who)S.who=d.who;if(d.jm)S.jm=d.jm;if(d.vis)S.vis=d.vis;if(d.cancel)S.cancel=true;if(d.close){S.drawer=false;S.cancel=false}
render(true)});
$('#md').addEventListener('click',e=>{if(e.target.id=='md'){S.drawer=S.cancel=false;render(true)}});
$('#th').onclick=()=>{root.dataset.theme=root.dataset.theme=='dark'?'light':'dark'};
render();
</script></body></html>
